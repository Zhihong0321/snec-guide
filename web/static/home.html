<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SNEC 2026 Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body data-nav-active="home">
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app app-wide">
    <header class="header">
      <a href="/" class="logo-link" aria-label="SNEC 2026 Guide home">
        <span class="logo" aria-hidden="true">☀</span>
      </a>
      <div class="header-text">
        <h1>SNEC 2026 Guide</h1>
        <p>PV+ &amp; Smart Energy · Shanghai NECC · Jun 3–5, 2026</p>
      </div>
      <nav id="siteNav" class="nav-links" aria-label="Main"></nav>
    </header>

    <section class="panel feed-hero">
      <div class="feed-hero-row">
        <div>
          <h2 class="panel-title">Latest updates</h2>
          <p class="muted">Notes and photos shared by the team across exhibitor booths.</p>
        </div>
        <button type="button" id="refreshFeed" class="btn-secondary">Refresh</button>
      </div>
    </section>

    <main id="feed" class="feed" aria-live="polite"></main>

    <p id="feedStatus" class="muted small feed-status"></p>

    <footer class="footer-spacer"></footer>
  </div>
  <script src="/static/site-nav.js"></script>
  <script src="/static/home.js"></script>
</body>
</html>
